[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ant-byte-env"
version = "0.1.0"
description = "A Pygame-rendered Gymnasium gridworld for ant byte foraging."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Jeremías Figueiredo Paschmann" },
  { name = "Francisco Nattero" },
  { name = "Juan Kaplan" }
]
dependencies = [
  "gymnasium>=0.29",
  "imageio>=2.35",
  "imageio-ffmpeg>=0.5",
  "numpy>=1.24",
  "pygame>=2.5"
]

[project.optional-dependencies]
rl = [
  "torch>=2.0",
  "torchrl>=0.13"
]
jax = [
  "jax>=0.4"
]
jax-cuda12 = [
  "jax[cuda12]>=0.4"
]
jax-cuda13 = [
  # On Python 3.10, pip resolves JAX to 0.6.x, which exposes CUDA 12 plugin
  # wheels but not CUDA 13 plugin wheels. CUDA 12 wheels run on CUDA 13 drivers.
  "jax[cuda12]>=0.4"
]
notebooks = [
  "notebook>=7.0",
  "tqdm>=4.66"
]
wandb = [
  "wandb>=0.18"
]
dev = [
  "jax>=0.4",
  "notebook>=7.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "torch>=2.0",
  "torchrl>=0.13",
  "tqdm>=4.66"
]

[project.urls]
Homepage = "https://example.com/cool-antz"

[project.scripts]
ant-byte = "ant_byte_env.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ant_byte_env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src/ant_byte_env"]
omit = [
  "src/ant_byte_env/jax_env.py",
  "src/ant_byte_env/training/jax_mappo/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
