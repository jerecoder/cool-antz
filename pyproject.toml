[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ant-byte-env"
version = "0.1.0"
description = "A Pygame-rendered Gymnasium gridworld for ant byte foraging."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "cool-antz contributors" }
]
dependencies = [
  "gymnasium>=0.29",
  "imageio>=2.35",
  "imageio-ffmpeg>=0.5",
  "numpy>=1.24",
  "pygame>=2.5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0"
]

[project.urls]
Homepage = "https://example.com/cool-antz"

[tool.hatch.build.targets.wheel]
packages = ["ant_byte_env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ant_byte_env --cov-report=term-missing --cov-fail-under=80"
